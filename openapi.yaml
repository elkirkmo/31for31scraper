openapi: 3.0.3
info:
  title: 31for31 JustWatch Scraper API
  description: >
    Scrapes JustWatch for current streaming offers (free / subscription /
    rent / buy) for the films tracked in `data.json`, so the 31for31 site's
    streaming links can be refreshed without hand-checking every title.
    See the [README](README.md) for how the scraping itself works.
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://31for31scraper.vercel.app
    description: Production (Vercel)
  - url: http://127.0.0.1:5000
    description: Local development

tags:
  - name: Health
    description: Liveness check
  - name: Scrape
    description: JustWatch scraping
  - name: Years
    description: >
      Managing which films exist for a given year, independent of scraping
      their offers. Currently backed by data.json -- writes only succeed
      where the filesystem is writable (local dev), not on Vercel's
      read-only production filesystem. This is expected to move to a real
      database (Supabase) later; the request/response shapes are designed
      to survive that move unchanged.

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: >
        Returns 200 if the API process is up and responding to requests.
        Does not check JustWatch reachability, `data.json` readability, or
        anything beyond "the server is running" -- a shallow liveness probe,
        not a readiness check. Does not require authentication.
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /api/scrape:
    get:
      operationId: scrape
      tags: [Scrape]
      summary: Scrape current JustWatch streaming offers
      description: >
        **Without `title`**: scrapes every film across every year in
        `data.json` and returns the same structure back, with each film's
        `service` array replaced by its current offers. This endpoint never
        writes to `data.json` -- review the response and copy in what you
        want. A single film failing to scrape does not fail the request;
        that film's entry comes back with an empty `service` array and an
        `error` field instead (see the `BatchScrapeResponse` schema).


        **With `title`**: scrapes a single film ad hoc, without touching
        `data.json`. Useful for testing a title, or a `justwatch_url`
        override, before adding/changing it in `data.json`. The response
        shape changes to a single `FilmResult` object instead of the
        year-keyed batch structure.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: title
          in: query
          required: false
          description: >
            Scrape a single film by title instead of every film in
            `data.json`. When present, the response is a `FilmResult`
            instead of a `BatchScrapeResponse`.
          schema:
            type: string
          example: "The Strangers (2008)"
        - name: url
          in: query
          required: false
          description: >
            Only meaningful together with `title`. Scrapes this exact
            JustWatch URL directly instead of guessing the slug from the
            title -- this is how you'd try out a `justwatch_url` override
            before writing it to `data.json`.
          schema:
            type: string
            format: uri
          example: "https://www.justwatch.com/us/movie/event-horizon-1997"
      responses:
        "200":
          description: >
            Scrape succeeded. Returns a `BatchScrapeResponse` when `title`
            was omitted, or a `FilmResult` when `title` was provided.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BatchScrapeResponse"
                  - $ref: "#/components/schemas/FilmResult"
              examples:
                batch:
                  summary: Full data.json scrape (no title param)
                  value:
                    "2025":
                      - id: 202526
                        date: "10/26/2025"
                        title: "Event Horizon"
                        justwatch_url: "https://www.justwatch.com/us/movie/event-horizon-1997"
                        service:
                          - name: "Kanopy"
                            type: "free"
                            price: null
                            currency: "USD"
                            link: "https://www.kanopy.com/en/title/..."
                          - name: "Amazon Video"
                            type: "rent"
                            price: 3.99
                            currency: "USD"
                            link: "https://watch.amazon.com/detail?..."
                    textContent:
                      heading: "31 for 31"
                single:
                  summary: "Single-title scrape (?title=...)"
                  value:
                    title: "The Thing From Another World"
                    url: "https://www.justwatch.com/us/movie/the-thing-from-another-world"
                    service:
                      - name: "The Roku Channel"
                        type: "free"
                        price: null
                        currency: "USD"
                        link: "https://therokuchannel.roku.com/details/..."
        "401":
          description: Missing or incorrect `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Unauthorized"
        "404":
          description: >
            `title` was provided but no JustWatch page could be found or
            parsed for it (e.g. the guessed slug 404s, or the title is
            misspelled). Only possible in single-title mode -- a batch
            scrape reports per-film failures inline in its 200 response
            instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmResult"
              example:
                title: "Not A Real Movie"
                service: []
                error: "No JustWatch page found at https://www.justwatch.com/us/movie/not-a-real-movie"
        "500":
          description: >
            The server has no `ADMIN_API_KEY` configured, so no key could
            possibly be valid. A deployment/configuration problem, not a
            caller error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "ADMIN_API_KEY is not configured on the server"
        "502":
          description: >
            `title` was provided and the request to JustWatch itself failed
            (timeout, connection error, DNS failure, non-404 HTTP error,
            etc.) -- distinct from 404, which means JustWatch responded but
            the title genuinely wasn't found. Only possible in single-title
            mode -- a batch scrape reports per-film network failures inline
            in its 200 response instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmResult"
              example:
                title: "Blood Feast"
                service: []
                error: "HTTPSConnectionPool(host='www.justwatch.com', port=443): Read timed out."

  /api/years/{year}:
    parameters:
      - name: year
        in: path
        required: true
        description: A 4-digit year, e.g. `2026`.
        schema:
          type: string
          pattern: "^\\d{4}$"
        example: "2026"
    put:
      operationId: replaceYear
      tags: [Years]
      summary: Replace a year's entire film list
      description: >
        Idempotent: PUT the same body twice, same result. Replaces
        whatever film list currently exists for `year` (or creates it, if
        it doesn't exist yet) with exactly the films given. Each film only
        needs `title`; `date` is optional. The server always computes
        `id` itself (`year * 100 + day-of-month`, or a random value > 31
        if `date` is omitted) and always starts `service` as `[]` --
        offers only come from `/api/scrape`. Any `id`/`service`/`error`
        fields in the request body are ignored. Validates the entire list
        before writing anything: one bad film fails the whole request,
        nothing is partially written.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FilmInput"
            example:
              - title: "Some 2026 Movie"
                date: "10/1/2026"
              - title: "Another 2026 Movie"
                date: "10/2/2026"
                justwatch_url: "https://www.justwatch.com/us/movie/another-2026-movie"
      responses:
        "200":
          description: The year's new film list, as stored (with computed ids).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FilmEntry"
        "400":
          description: >
            Malformed request: body isn't a JSON array, a film is missing
            `title`, `date` doesn't match `M/D/YYYY`, `date`'s year
            doesn't match the `{year}` path parameter, the day is out of
            1-31, or two films in the list share the same `date`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or incorrect `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >
            Could not persist the change -- most likely because the
            filesystem is read-only (e.g. Vercel production). Works in
            local dev.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Could not write data.json: [Errno 30] Read-only file system. This endpoint needs a writable filesystem..."
    post:
      operationId: addFilm
      tags: [Years]
      summary: Add a single film to a year's list
      description: >
        Appends one new film to `year`'s existing list (creating `year` if
        it doesn't exist yet). Unlike PUT, this does not touch any film
        already in the list. Rejected with 400 if the given `date`
        collides with a film already in that year.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmInput"
            example:
              title: "A Late Addition"
              date: "10/15/2026"
      responses:
        "201":
          description: The newly created film entry, with its computed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmEntry"
        "400":
          description: >
            Malformed request: body isn't a JSON object, missing `title`,
            invalid `date`, or `date` collides with a film already in
            `year`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or incorrect `X-API-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >
            Could not persist the change -- most likely because the
            filesystem is read-only (e.g. Vercel production). Works in
            local dev.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Must match the server's `ADMIN_API_KEY` environment variable.

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Offer:
      type: object
      description: One streaming option for a film, as currently listed on JustWatch.
      properties:
        name:
          type: string
          description: Display name of the streaming service.
          example: "Amazon Video"
        type:
          type: string
          description: >
            Bucketed from JustWatch's monetization type. `subscription`
            covers titles included with a service like Netflix or a channel
            add-on (no separate price).
          enum: [free, subscription, rent, buy, cinema, unknown]
          example: rent
        price:
          type: number
          nullable: true
          description: Null for free/subscription offers.
          example: 3.99
        currency:
          type: string
          nullable: true
          example: USD
        link:
          type: string
          format: uri
          nullable: true

    FilmInput:
      type: object
      description: >
        What the caller supplies to PUT/POST `/api/years/{year}`. The
        server computes `id` and `service` itself -- don't send them (they
        are ignored if present).
      required: [title]
      properties:
        title:
          type: string
          description: Non-empty; leading/trailing whitespace is trimmed.
          example: "Some 2026 Movie"
        date:
          type: string
          description: >
            `M/D/YYYY`, where YYYY must match the `{year}` path parameter
            and D must be 1-31. Omit entirely (or send `""`) for a film
            with no set date yet -- it gets a random id instead of a
            real calendar day.
          example: "10/1/2026"
        justwatch_url:
          type: string
          format: uri
          description: Optional. Same override as in data.json -- see FilmEntry.

    FilmEntry:
      type: object
      description: >
        One film's entry within a `BatchScrapeResponse` year. Preserves
        whatever fields the film had in `data.json` (typically `id`, `date`,
        `title`, and optionally `justwatch_url`); `service` is always
        replaced with current offers, and `error` is added only if this
        film's scrape failed.
      additionalProperties: true
      required: [id, title, service]
      properties:
        id:
          type: integer
          description: >
            Stable unique identifier: `year * 100 + day-of-month` (e.g. `1`
            -> `202501`, `26` -> `202526`). For a year with more than 31
            films, the overflow entries get a randomly assigned two-digit
            value greater than 31 instead of a real day-of-month, so it
            stays unique but isn't a valid calendar day.
          example: 202526
        date:
          type: string
          example: "10/26/2025"
        title:
          type: string
          example: "Event Horizon"
        justwatch_url:
          type: string
          format: uri
          nullable: true
          description: >
            Optional override set in `data.json` for titles whose JustWatch
            slug can't be guessed from the title text. Takes priority over
            slug-guessing whenever present.
        service:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        error:
          type: string
          nullable: true
          description: Present only if this film's scrape failed; `service` will be empty.

    BatchScrapeResponse:
      type: object
      description: >
        Keyed by year (e.g. `"2024"`, `"2025"`), each holding a list of
        `FilmEntry` objects. Non-film keys present in `data.json` (e.g.
        `textContent`, the site's copy) pass through completely unchanged.
      additionalProperties:
        oneOf:
          - type: array
            items:
              $ref: "#/components/schemas/FilmEntry"
          - description: Passthrough value for a non-film key (e.g. `textContent`).

    FilmResult:
      type: object
      description: >
        Result of scraping a single film (the `?title=` response shape).
        `url` is only present when the scrape succeeded (200) -- it's
        omitted from 404/502 error bodies, which only have `title`,
        `service`, and `error`.
      required: [title, service]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
          description: The canonical JustWatch URL that was actually scraped. Only present on success.
        service:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        error:
          type: string
          nullable: true
          description: Present only on failure; `service` will be empty.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
